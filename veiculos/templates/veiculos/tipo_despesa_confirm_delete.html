{% extends 'veiculos/base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold mb-4">Confirmar Exclusão</h2>
    <p class="mb-2">Tem certeza que deseja excluir o tipo de despesa <strong>{{ tipo.nome }}</strong>?</p>
    <p class="text-sm text-red-600 mb-6">Esta ação não poderá ser desfeita. Se houver despesas vinculadas a este tipo, a exclusão será bloqueada.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-danger mr-2">Sim, excluir</button>
        <a href="{% url 'tipo_despesa_lista' %}" class="btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
